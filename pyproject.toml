[project]
name = "heatwave"
version = "0.0.1"
description = "Probabilistic district-level heatwave forecasts for Uttar Pradesh (see reference.md)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "geopandas>=1.2.0",
    "huggingface-hub>=2.1.1",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pandera[pandas]>=0.34.1",
    "pyarrow>=25.0.1",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shapely>=2.1.2",
]

[project.scripts]
heatwave = "heatwave.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heatwave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: long real-data checks; run with `pytest -m slow`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
