# Data sources and spatial mapping. reference.md §2.1–§2.2.

boundaries:
  # Interim source: GADM 4.1 level 2 (a Survey of India-consistent file is on the
  # To do later list). Not in git (licence): download gadm41_IND.gpkg from
  # https://gadm.org/download_country.html and place it at this path.
  path: data/external/boundaries/gadm41_IND.gpkg
  layer: ADM_ADM_2
  state_field: NAME_1
  state_name: Uttar Pradesh
  district_field: NAME_2
  expected_district_count: 75
  # GADM uses pre-rename names; map them to current official names.
  renames:
    Allahabad: Prayagraj
    Faizabad: Ayodhya
    Sant Ravi Das Nagar: Bhadohi

geo:
  # Albers equal-area centred on UP, for areas and weights. (EPSG:7755, used by
  # the earlier project, is Lambert *Conformal* Conic: it preserves shape, not area.)
  equal_area_crs: "+proj=aea +lat_1=24 +lat_2=30 +lat_0=26.5 +lon_0=80.5 +datum=WGS84 +units=m +no_defs"
  # District/cell fragments below this share of the district's area are boundary
  # slivers: dropped, and the remaining weights renormalised to sum to 1.
  min_weight: 0.001
  # Cell edges are densified to this spacing (degrees) before projection, so
  # edges along parallels stay accurate.
  densify_deg: 0.05
  # District Tmax is the area-weighted mean of its cells. The "hottest cell" Tmax
  # (reference.md §2.2) only considers cells covering at least this share of the
  # district, so edge slivers (e.g. a 0.7 % foothill cell) cannot set it
  # (docs/decisions/004).
  cellmax_min_share: 0.10

grid:
  # MERRA-2 native grid, as served by NASA POWER (1/2 deg lat x 5/8 deg lon).
  # Cell centres at lat = lat_origin + dlat*j, lon = lon_origin + dlon*i.
  name: merra2
  lat_origin: -90.0
  lon_origin: -180.0
  dlat: 0.5
  dlon: 0.625

outputs:
  reference_dir: data/reference
  silver_dir: data/silver          # derived, rebuilt from raw: district daily tables

power:
  # NASA POWER Daily API (verified: docs/decisions/001). Max 20 parameters per
  # point request; LST is requested explicitly and recorded.
  base_url: https://power.larc.nasa.gov/api/temporal/daily/point
  community: AG
  time_standard: LST
  fill_value: -999.0
  start: "1981-01-01"
  # Solar parameters excluded (5-7 day latency): reference.md §2.1.
  # WD10M (wind direction) is NOT fetched: POWER returns invalid values (-98,990
  # to -5,000 degrees) for every cell from 2012-12-31 onward. U10M/V10M replace it;
  # before 2013 WD10M equals the direction of mean (U10M, V10M) to 0.1 deg.
  # See docs/decisions/004. Old WD10M rows stay in the raw store for audit.
  parameters: [T2M_MAX, T2M_MIN, T2M, T2MDEW, RH2M, QV2M, PRECTOTCORR,
               WS10M, U10M, V10M, PS, GWETTOP, GWETROOT]
  # Daily run re-fetches this many trailing days to capture GEOS-IT -> MERRA-2
  # revisions (reference.md §2.3).
  trailing_days: 120
  request:
    timeout_s: 120
    max_retries: 6
    backoff_base_s: 2.0         # waits 2, 4, 8, ... s (plus jitter); Retry-After wins
    pause_between_requests_s: 1.0

storage:
  # Local mirror of the private Hugging Face dataset (reference.md §5.3).
  root: data
  raw_power_dir: raw/power      # bitemporal, append-only, partitioned by obs_year
  runs_log: runs/ingest_runs.parquet
  cache_dir: cache/power        # backfill response cache (local only, not uploaded)

hub:
  # Private dataset repo holding all data. Token comes from the HF_TOKEN env var
  # (GitHub Actions secret in CI); repo id from HF_DATASET_REPO if set.
  repo_id: tarun-rai/cro-heatwave-data
  repo_type: dataset

imd:
  # IMD Pune 1-degree gridded daily Tmax (label validation / bias reference,
  # reference.md §2.4). Binary float32 little-endian, shape (days, 31 lat, 31 lon),
  # lat 7.5..37.5 N and lon 67.5..97.5 E ascending; 99.9 = no data (sea).
  # Licence: IMD terms restrict redistribution; stored only in the private dataset.
  tmax_url: https://imdpune.gov.in/cmpg/Griddata/maxtemp.php
  tmax_form_field: maxtemp
  referer: https://imdpune.gov.in/cmpg/Griddata/Max_1_Bin.html
  lat_first: 7.5
  lon_first: 67.5
  step_deg: 1.0
  n_lat: 31
  n_lon: 31
  missing_value: 99.9
  start_year: 1981
  raw_dir: raw/imd/tmax          # under storage.root; files <year>.GRD, as downloaded
  request:
    timeout_s: 300
    max_retries: 6
    backoff_base_s: 10.0         # the server is slow and resets connections at times
    pause_between_requests_s: 5.0

gsod:
  # NOAA Global Summary of the Day (public domain): station daily maxima used as
  # the reference level for the label's bias correction (docs/decisions/005).
  history_url: https://www.ncei.noaa.gov/pub/data/noaa/isd-history.csv
  data_url: https://www.ncei.noaa.gov/data/global-summary-of-the-day/access/{year}/{station}.csv
  # Stations inside UP, or within this distance of its boundary (degrees).
  boundary_buffer_deg: 0.05
  # Development years only: the final-test block (2021-2025) is not downloaded.
  years: [1981, 2020]
  missing_value: 9999.9
  # MAX_ATTRIBUTES "*" = maximum derived from hourly reports (biased low): excluded.
  derived_flag: "*"
  raw_dir: raw/stations/gsod     # <year>/<station>.csv, as downloaded
  request:
    timeout_s: 60
    max_retries: 4
    backoff_base_s: 2.0
    pause_between_requests_s: 0.2

# Known upstream defects (docs/decisions/007). Raw rows are never changed; the
# best-known views ignore the affected versions, falling back to the last good
# version, else returning the value as missing. A rule keyed on API versions
# stops applying by itself when POWER ships a fix under a NEW version; a silent
# fix under the same version needs the rule lifted by hand (watch the daily
# "known_defects_active" count).
known_defects:
  - id: power_v2.10.1_precip_x24
    variable: PRECTOTCORR
    api_versions: [v2.10.0, v2.10.1]   # first bad batch (21 Oct) still said v2.10.0
    ingested_from: "2026-10-21T00:00:00+00:00"
    obs_from: 2026-06-23
    reason: >
      From 2026-10-21 POWER API v2.10.1 serves precipitation for 2026-06-23
      onward at ~24x its earlier values (69 % of revisions within 1 % of x24;
      July mean 238 mm/day; max 2,700 mm/day). Not a clean factor (September
      median x11.5), so not corrected by division.
