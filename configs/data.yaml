# Data sources and spatial mapping. reference.md §2.1–§2.2.

boundaries:
  # Interim source: GADM 4.1 level 2 (a Survey of India-consistent file is on the
  # To do later list). Not in git (licence): download gadm41_IND.gpkg from
  # https://gadm.org/download_country.html and place it at this path.
  path: data/external/boundaries/gadm41_IND.gpkg
  layer: ADM_ADM_2
  state_field: NAME_1
  state_name: Uttar Pradesh
  district_field: NAME_2
  expected_district_count: 75
  # GADM uses pre-rename names; map them to current official names.
  renames:
    Allahabad: Prayagraj
    Faizabad: Ayodhya
    Sant Ravi Das Nagar: Bhadohi

geo:
  # Albers equal-area centred on UP, for areas and weights. (EPSG:7755, used by
  # the earlier project, is Lambert *Conformal* Conic: it preserves shape, not area.)
  equal_area_crs: "+proj=aea +lat_1=24 +lat_2=30 +lat_0=26.5 +lon_0=80.5 +datum=WGS84 +units=m +no_defs"
  # District/cell fragments below this share of the district's area are boundary
  # slivers: dropped, and the remaining weights renormalised to sum to 1.
  min_weight: 0.001
  # Cell edges are densified to this spacing (degrees) before projection, so
  # edges along parallels stay accurate.
  densify_deg: 0.05

grid:
  # MERRA-2 native grid, as served by NASA POWER (1/2 deg lat x 5/8 deg lon).
  # Cell centres at lat = lat_origin + dlat*j, lon = lon_origin + dlon*i.
  name: merra2
  lat_origin: -90.0
  lon_origin: -180.0
  dlat: 0.5
  dlon: 0.625

outputs:
  reference_dir: data/reference

power:
  # NASA POWER Daily API (verified: docs/decisions/001). Max 20 parameters per
  # point request; LST is requested explicitly and recorded.
  base_url: https://power.larc.nasa.gov/api/temporal/daily/point
  community: AG
  time_standard: LST
  fill_value: -999.0
  start: "1981-01-01"
  # Solar parameters excluded (5-7 day latency): reference.md §2.1.
  parameters: [T2M_MAX, T2M_MIN, T2M, T2MDEW, RH2M, QV2M, PRECTOTCORR,
               WS10M, WD10M, PS, GWETTOP, GWETROOT]
  # Daily run re-fetches this many trailing days to capture GEOS-IT -> MERRA-2
  # revisions (reference.md §2.3).
  trailing_days: 120
  request:
    timeout_s: 120
    max_retries: 6
    backoff_base_s: 2.0         # waits 2, 4, 8, ... s (plus jitter); Retry-After wins
    pause_between_requests_s: 1.0

storage:
  # Local mirror of the private Hugging Face dataset (reference.md §5.3).
  root: data
  raw_power_dir: raw/power      # bitemporal, append-only, partitioned by obs_year
  runs_log: runs/ingest_runs.parquet
  cache_dir: cache/power        # backfill response cache (local only, not uploaded)

hub:
  # Private dataset repo holding all data. Token comes from the HF_TOKEN env var
  # (GitHub Actions secret in CI); repo id from HF_DATASET_REPO if set.
  repo_id: tarun-rai/cro-heatwave-data
  repo_type: dataset
