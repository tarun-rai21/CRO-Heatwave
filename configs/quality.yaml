# Data quality rules (reference.md §6.2 Phase 3). See docs/decisions/004.
#
# HARD checks: physically impossible values. Any violation fails the pipeline.
# SOFT checks: suspicious but possible values. Flagged and kept, never deleted
# or clipped: real fronts, storms and dust events exist, and extremes are the signal.

hard:
  # Inclusive ranges, generous but physically plausible for UP. Units as served
  # by POWER: C, %, g/kg, mm/day, m/s, kPa, fraction.
  ranges:
    T2M_MAX: [-5, 55]
    T2M_MIN: [-15, 45]
    T2M: [-10, 50]
    T2MDEW: [-40, 35]
    RH2M: [0, 100]
    QV2M: [0, 40]
    PRECTOTCORR: [0, 600]
    WS10M: [0, 50]
    U10M: [-50, 50]
    V10M: [-50, 50]
    PS: [80, 106]
    GWETTOP: [0, 1]
    GWETROOT: [0, 1]
  # Tmin <= T2M <= Tmax and dew point <= T2M, allowing for 0.01 C reporting.
  consistency_tolerance_c: 0.05
  # Daily job: fail if the newest complete day is older than this (L + 2).
  max_latency_days: 5

soft:
  # A day-to-day jump is suspicious only if it is extreme for that cell and
  # month (robust z) AND no neighbouring cell moved similarly the same day.
  # Coherent jumps across neighbours are weather (fronts, storms), not errors.
  jump:
    variables: [T2M_MAX, T2M_MIN]
    z: 10.0
    neighbour_z: 5.0
  # A cell's Tmax departing from its neighbours' median by more than this,
  # beyond its usual offset for that month.
  spatial:
    variables: [T2M_MAX]
    abs_dev_c: 5.0

imd:
  tmax_range: [-5, 55]
  # Region checked for gaps and ranges (min_lon, min_lat, max_lon, max_lat).
  up_bbox: [77.0, 23.5, 84.5, 30.5]

# Flags that have been looked at and explained. qa-report lists any flag NOT in
# here as "unreviewed" and exits with an error until it is explained.
