# Frozen problem definition. Source of truth for the values in reference.md §1–§3.
#
# Everything here changes WHAT is being predicted or HOW it is judged.
# Change it only by updating reference.md (section + change log) first,
# and never after seeing model results.

dates:                         # reference.md §1.3
  # t = as-of date (last observed day); s = t + latency_days = issue date;
  # valid date = s + h for h in [horizon_min, horizon_max].
  latency_days: 3              # confirmed from the daily latency log in Phase 2
  horizon_min: 1
  horizon_max: 10

season:                        # reference.md §3.1, §4.3
  evaluation: {start: "03-01", end: "06-30"}   # provisional until label QA (Phase 4)
  training: {start: "02-15", end: "07-15"}     # season plus shoulders

target:                        # reference.md §2.4
  # The IMD plains heatwave-day CONDITION at district level, not IMD's
  # operational declaration (>= 2 stations in a subdivision, 2 consecutive days).
  name: imd_plains_heatwave_day
  tmax_floor_c: 40.0           # departure criteria apply only when Tmax >= 40
  departure_heatwave_c: 4.5    # heatwave: departure >= 4.5
  departure_severe_c: 6.4      # severe: departure > 6.4 (strict)
  absolute_heatwave_c: 45.0    # heatwave: Tmax >= 45
  absolute_severe_c: 47.0      # severe: Tmax >= 47
  round_decimals: 1            # IMD reports 0.1 C; values rounded before comparison
  normal:
    period: [1991, 2020]       # IMD's current normals period
    smoothing: harmonics       # harmonics | window; final choice in Phase 4
    n_harmonics: 3
  # Decided by measurement in Phase 4: power | power_bias_corrected | imd_gridded
  tmax_source: undecided

onset:                         # reference.md §3.5
  lookback_days: 3             # onset case: no heatwave day in the 3 days up to t

validation:                    # reference.md §3.2–§3.4
  development: [1981, 2020]
  final_test: [2021, 2025]     # single use, after everything is frozen and tagged
  season_2026: [2026, 2026]    # single use, after the final test report
  folds:
    - {fold: 1, train: [1981, 2005], validate: [2006, 2008]}
    - {fold: 2, train: [1981, 2008], validate: [2009, 2011]}
    - {fold: 3, train: [1981, 2011], validate: [2012, 2014]}
    - {fold: 4, train: [1981, 2014], validate: [2015, 2017]}
    - {fold: 5, train: [1981, 2017], validate: [2018, 2020]}
  inner_block_seasons: 3       # early stopping / tuning; never the fold being scored
  bootstrap_unit: year         # resample whole seasons, all districts together

tiers:                         # reference.md §3.6
  # Rules are fixed here; probability thresholds are computed from
  # out-of-fold development predictions and frozen with the model.
  watch:   {rule: min_pod, value: 0.8}            # catch >= 80% of heatwave days
  alert:   {rule: min_cost, miss_to_false_alarm: 3.0}
  warning: {rule: max_far, value: 0.5}            # >= 50% of warnings verify
